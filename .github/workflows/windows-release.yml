name: Windows build, test and package

on:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build LaserWorksManager.slnx -c Release

      - name: Test (unit, SQLite integration, performance, headless UI)
        run: dotnet test tests/LaserWorks.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Publish self-contained LaserWorksManager.exe
        run: dotnet publish src/LaserWorks.Desktop -c Release -r win-x64 -o artifacts/publish/win-x64

      - name: Smoke test the packaged executable on Windows
        run: |
          $env:LASERWORKS_DATA = "$env:RUNNER_TEMP\lw-smoke"
          $p = Start-Process -FilePath artifacts/publish/win-x64/LaserWorksManager.exe -ArgumentList "--smoke-test" -PassThru -Wait
          Get-Content "$env:LASERWORKS_DATA\logs\*.log"
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }

      - name: Demo company
        run: |
          dotnet run --project src/LaserWorks.Tools -c Release -- demo artifacts/demo/data
          Copy-Item artifacts/demo/data/LaserWorksDemo.lwbak artifacts/demo/

      - name: Installer (NSIS)
        run: |
          choco install nsis -y --no-progress
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $display = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.InformationalVersion
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Push-Location installer
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 "/DVERSION=$version" "/DDISPLAYVERSION=$display" "/DSOURCE=..\artifacts\publish\win-x64" "/DOUTFILE=..\artifacts\release\LaserWorksManagerSetup.exe" LaserWorksManager.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Pop-Location

      - name: Install silently, start the installed app, uninstall
        run: |
          $dir = "$env:RUNNER_TEMP\LaserWorksInstall"
          Start-Process artifacts/release/LaserWorksManagerSetup.exe -ArgumentList "/S", "/D=$dir" -Wait
          if (-not (Test-Path "$dir\LaserWorksManager.exe")) { throw "installer did not install the executable" }
          $env:LASERWORKS_DATA = "$env:RUNNER_TEMP\lw-installed"
          $p = Start-Process "$dir\LaserWorksManager.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installed app smoke test failed" }
          Start-Process "$dir\Uninstall.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\LaserWorksManager.exe") { throw "uninstaller left the executable behind" }

      - name: Portable zip, notes, checksums
        run: |
          $display = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.InformationalVersion
          $p = "artifacts/portable/LaserWorksManager"
          New-Item -ItemType Directory -Force "$p/docs" | Out-Null
          Copy-Item artifacts/publish/win-x64/LaserWorksManager.exe, README.md, LICENSE-NOTICES.txt, artifacts/demo/LaserWorksDemo.lwbak $p
          Copy-Item docs/*.md "$p/docs"
          "Data is stored in the 'data' folder next to LaserWorksManager.exe while this file exists." | Set-Content "$p/portable.flag"
          Compress-Archive -Path $p -DestinationPath "artifacts/release/LaserWorksManager-$display-win-x64-portable.zip"
          Copy-Item artifacts/publish/win-x64/LaserWorksManager.exe, artifacts/demo/LaserWorksDemo.lwbak, docs/RELEASE_NOTES.md artifacts/release/
          Compress-Archive -Path artifacts/demo/data/laserworks.db -DestinationPath artifacts/release/LaserWorksDemo-database.zip
          Get-ChildItem artifacts/release -File | Where-Object Name -ne "SHA256SUMS.txt" | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content artifacts/release/SHA256SUMS.txt
          Get-Content artifacts/release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results

      - uses: actions/upload-artifact@v4
        with:
          name: LaserWorksManager-windows
          path: artifacts/release

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/release/*
          prerelease: true
